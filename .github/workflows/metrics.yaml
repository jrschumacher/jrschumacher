name: Metrics
on:
  # Updated daily
  schedule: [{cron: "0 0 * * *"}]
  # Or manually
  workflow_dispatch:
  # Or when pushing to the default branch
  push: {branches: ["master"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Commit with the PAT rather than the default GITHUB_TOKEN: commits
          # made by github-actions[bot] don't count as repository activity, so
          # the schedule gets auto-disabled after 60 idle days.
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: jrschumacher
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_followup: yes
          plugin_followup_sections: repositories
          repositories: 1000
          repositories_forks: yes
